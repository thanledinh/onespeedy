# Cache theo loại file (dùng map để các header bảo mật bên dưới áp dụng cho mọi request)
map $uri $cache_control {
    ~^/_astro/                                                      "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|webp|avif|svg|ico|woff2?|webmanifest)$           "public, max-age=604800";
    default                                                         "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Kiểm tra sức khoẻ cho Dokploy / Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # /vi/services -> /vi/services/ (Astro build dạng thư mục)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
